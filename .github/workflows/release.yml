name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
          python-version: "3.14"
      - name: compute the next version with git-cliff
        id: next
        run: |
          tag="$(uvx git-cliff@2.13.1 --bumped-version)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::nothing releasable since $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: set the version in pyproject.toml and uv.lock
        run: |
          uv version "${{ steps.next.outputs.version }}" --no-sync
          uv lock --check
      - name: commit and tag the release locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "chore(release): ${{ steps.next.outputs.tag }}"
          git tag "${{ steps.next.outputs.tag }}"
      - name: build
        run: uv build
      - name: publish to PyPI with trusted publishing
        run: uv publish --trusted-publishing always
      - name: push the release commit and tag
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/${{ steps.next.outputs.tag }}"
