[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
    { message = "^feat", group = "feat" },
    { message = "^fix", group = "fix" },
    { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
initial_tag = "v0.0.1"
