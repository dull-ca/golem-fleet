[project]
name = "golem-fleet"
version = "0.0.1"
description = "Declare a fleet of machines and the components placed on them, and render what golemctl, pulumi and provisioning consume."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
authors = [{ name = "Lakin Wecker", email = "lakin.wecker@gmail.com" }]
keywords = ["fleet", "golem", "golemctl", "emet", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.27.1,<1.0.0",
    "rich>=14.0",
    "strabs-doit>=0.1.4",
]

[project.urls]
Repository = "https://github.com/dull-ca/golem-fleet"
Issues = "https://github.com/dull-ca/golem-fleet/issues"

[dependency-groups]
dev = ["pytest>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golem_fleet"]

[tool.hatch.build.targets.sdist]
only-include = ["golem_fleet", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "CPY",
    "COM812",
    "ISC001",
    "N818",
    "S105",
    "S106",
    "S107",
    "S310",
    "TC",
    "S404",
    "S603",
    "S606",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "INP001"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["golem_fleet", "tests"]
